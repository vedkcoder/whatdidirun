[project]
name = "whatdidirun"
version = "0.1.0"
description = "Index your terminal commands and search them in natural language (LM Studio + ChromaDB + BM25)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "chromadb>=0.5",
    "dateparser>=1.2",
    "textual>=0.80",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
recall = "recall.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]
# web/dist is generated by `npm run build` and gitignored; force-include it in the wheel
artifacts = ["src/recall/web/dist/**"]

[tool.hatch.build.targets.sdist]
# ship the built UI in the sdist too, so wheels built from it (e.g. `uv build`) include it
artifacts = ["src/recall/web/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lmstudio: needs a reachable LM Studio server (RECALL_LLM_BASE_URL)"]
