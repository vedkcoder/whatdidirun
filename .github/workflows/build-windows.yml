# Builds the Windows app + installer. Called by ci.yml (pull requests) and release.yml (tags).
# Produces the artifact `windows-installer` containing WhatDidIRun-<version>-setup.exe.

name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install (tray extra + PyInstaller)
        run: uv sync --locked --extra tray --group windows

      - name: Tests on Windows
        run: uv run pytest -q

      - name: PyInstaller
        run: uv run pyinstaller packaging/windows/whatdidirun.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test recall.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RECALL_DATA_DIR = Join-Path $env:RUNNER_TEMP 'recall-smoke'
          $env:RECALL_LLM_BASE_URL = 'http://127.0.0.1:9'
          $recall = Resolve-Path dist/WhatDidIRun/recall.exe
          & $recall --help
          if ($LASTEXITCODE) { throw "recall --help failed" }
          New-Item -ItemType Directory -Force $env:RECALL_DATA_DIR | Out-Null
          '{"cmd":"Get-ChildItem C:\\Windows","cwd":"C:\\","exit":0,"start":"1764200000.1","end":"1764200000.2","host":"ci","session":"s","shell":"pwsh"}' |
            Set-Content -Encoding ascii (Join-Path $env:RECALL_DATA_DIR 'spool.jsonl')
          & $recall ingest --no-embed --no-describe
          if ($LASTEXITCODE) { throw "recall ingest failed" }
          $out = & $recall search Get-ChildItem
          $out
          if (-not ($out -match 'Get-ChildItem')) { throw "search did not find the ingested command" }
          & $recall stats
          & $recall init powershell
          if (-not (Test-Path dist/WhatDidIRun/_internal/recall/web/dist/index.html)) { throw "web UI missing from bundle" }

      - name: Test the PowerShell hook
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RECALL_DATA_DIR = Join-Path $env:RUNNER_TEMP 'recall-hook'
          # Like a real console: PSReadLine is loaded only after the profile, and recall may not be on PATH yet.
          Remove-Module PSReadLine -ErrorAction SilentlyContinue
          if (Get-Command recall -ErrorAction SilentlyContinue) { throw 'recall unexpectedly on PATH' }
          . (Resolve-Path dist/WhatDidIRun/_internal/recall/capture/recall.ps1)
          if ($global:__recall_bin -ne (Resolve-Path dist/WhatDidIRun/recall.exe).ProviderPath) { throw "hook did not find the bundled recall.exe: '$global:__recall_bin'" }
          if ($global:__recall_key_bound) { throw 'key bound before PSReadLine was loaded?' }
          Import-Module PSReadLine
          prompt | Out-Null
          $h = Get-PSReadLineKeyHandler -Chord Ctrl+g
          $h
          if (-not $global:__recall_key_bound -or ($h.Function -ne 'recall')) { throw 'Ctrl+g not bound to recall after the first prompt' }
          $now = Get-Date
          Add-History -InputObject ([pscustomobject]@{ CommandLine = 'git status'; ExecutionStatus = 'Completed'; StartExecutionTime = $now.AddSeconds(-2); EndExecutionTime = $now })
          prompt | Out-Null
          Add-History -InputObject ([pscustomobject]@{ CommandLine = ' secret-thing'; ExecutionStatus = 'Completed'; StartExecutionTime = $now; EndExecutionTime = $now })
          prompt | Out-Null
          prompt | Out-Null   # no new history: must not duplicate
          $lines = @(Get-Content (Join-Path $env:RECALL_DATA_DIR 'spool.jsonl'))
          $lines
          if ($lines.Count -ne 1) { throw "expected 1 spool line, got $($lines.Count)" }
          $rec = $lines[0] | ConvertFrom-Json
          if ($rec.cmd -ne 'git status' -or $rec.exit -ne 0 -or $rec.shell -ne 'pwsh') { throw "bad record: $($lines[0])" }
          if ([double]$rec.end - [double]$rec.start -lt 1.5) { throw "bad timing: $($lines[0])" }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/whatdidirun.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          Get-ChildItem dist/installer

      - name: Install, run and uninstall (silent)
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/installer/*.exe)[0].FullName
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS="powershell,autostart"', "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "setup exited with $($p.ExitCode)" }

          $app = Join-Path $env:LOCALAPPDATA 'Programs\WhatDidIRun'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'What did I Run'
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $profiles = @("$docs\PowerShell\Microsoft.PowerShell_profile.ps1", "$docs\WindowsPowerShell\Microsoft.PowerShell_profile.ps1")
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          function Test-UserPath { ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $app }

          foreach ($f in "$app\recall.exe", "$app\WhatDidIRun.exe", "$menu\What did I Run.lnk") { if (-not (Test-Path -LiteralPath $f)) { throw "missing after install: $f" } }
          if (-not (Test-UserPath)) { throw 'install dir not on user PATH' }
          if (-not (Get-ItemProperty $runKey -Name WhatDidIRun -ErrorAction SilentlyContinue)) { throw 'login item missing' }
          foreach ($f in $profiles) { if (-not (Select-String -LiteralPath $f -SimpleMatch 'whatdidirun (recall)' -Quiet)) { throw "hook not in $f" } }
          & "$app\recall.exe" --help | Out-Null
          if ($LASTEXITCODE) { throw 'installed recall.exe failed' }

          # The tray app should serve the web UI.
          $env:RECALL_DATA_DIR = Join-Path $env:RUNNER_TEMP 'recall-tray'
          Start-Process "$app\WhatDidIRun.exe"
          $ok = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-RestMethod http://127.0.0.1:8765/api/health -TimeoutSec 2).embed_model) { $ok = $true; break } } catch { }
            Start-Sleep 2
          }
          if (-not $ok) { throw 'tray app did not serve the web UI within 120 s' }
          (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).Content.Substring(0, 60)

          # Settings API: save an API key (encrypted with a DPAPI-wrapped master key), see it masked, reveal it.
          $h = @{ 'X-Recall-Request' = '1' }
          $secret = 'sk-ci-test-0123456789'
          Invoke-RestMethod -Method Put http://127.0.0.1:8765/api/settings/keys/openai -Headers $h -ContentType 'application/json' -Body (@{ api_key = $secret } | ConvertTo-Json) | Out-Null
          $settings = Invoke-WebRequest http://127.0.0.1:8765/api/settings -Headers $h -UseBasicParsing
          if ($settings.Content -match [regex]::Escape($secret)) { throw 'settings response leaked the API key' }
          $openai = ($settings.Content | ConvertFrom-Json).providers | Where-Object id -eq 'openai'
          if ($openai.key.hint -ne '…6789') { throw "unexpected key hint: $($openai.key.hint)" }
          if (($settings.Content | ConvertFrom-Json).key_backend -ne 'dpapi') { throw 'expected the DPAPI key backend' }
          $revealed = Invoke-RestMethod -Method Post http://127.0.0.1:8765/api/settings/keys/openai/reveal -Headers $h
          if ($revealed.api_key -ne $secret) { throw 'reveal did not return the saved key' }
          if (-not (Test-Path (Join-Path $env:RECALL_DATA_DIR 'secret.key.dpapi'))) { throw 'DPAPI master key file missing' }
          try { Invoke-RestMethod http://127.0.0.1:8765/api/settings | Out-Null; throw 'settings answered without X-Recall-Request' } catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw } }
          'settings API OK'

          # Uninstall (the uninstaller relaunches itself from %TEMP%, so wait for the files to go).
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          foreach ($i in 1..60) { if (-not (Test-Path "$app\recall.exe")) { break }; Start-Sleep 2 }
          if (Test-Path "$app\recall.exe") { throw 'uninstall left files behind' }
          if (Test-Path -LiteralPath "$menu\What did I Run.lnk") { throw 'Start Menu shortcut left behind' }
          if (Test-UserPath) { throw 'PATH entry left behind' }
          if (Get-ItemProperty $runKey -Name WhatDidIRun -ErrorAction SilentlyContinue) { throw 'login item left behind' }
          foreach ($f in $profiles) { if ((Test-Path $f) -and (Select-String -LiteralPath $f -SimpleMatch 'whatdidirun (recall)' -Quiet)) { throw "hook left in $f" } }
          if (Get-Process WhatDidIRun -ErrorAction SilentlyContinue) { throw 'tray app still running after uninstall' }
          'install / tray / uninstall OK'

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
