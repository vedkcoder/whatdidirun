# Release pipeline: push a tag like v0.2.0 (or v0.2.0.1 for a bugfix) and this
#   1. runs the backend and frontend tests,
#   2. builds the Python wheel/sdist (with the web UI bundled),
#   3. builds a multi-arch Docker image and pushes it to ghcr.io/<owner>/whatdidirun,
#   4. builds the Windows installer (build-windows.yml),
#   5. creates a GitHub Release (or updates an existing one) with the wheel, sdist and setup.exe attached.
#
# To (re)release an existing tag without pushing a new one: Actions → Release → Run workflow → enter the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches pyproject version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Backend tests
        run: |
          uv sync --locked
          uv run pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend tests
        working-directory: web
        run: |
          npm ci
          npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Versions are X.Y.Z for releases and X.Y.Z.N for bugfixes (not semver), so compute the tags here:
      # v0.1.3.1 -> 0.1.3.1, 0.1, latest
      - id: ver
        run: |
          v="${TAG#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$v" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/whatdidirun
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=WhatdidIRun??
            org.opencontainers.image.description=Search your shell history in plain English
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    needs: test
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    needs: [package, docker, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/whatdidirun:${TAG#v}"
          notes=$(printf '### Windows\n\nDownload `WhatDidIRun-%s-setup.exe` below and run it.\n\n### Docker\n\n```bash\ndocker pull %s\n```\n\n### Python\n\nDownload the wheel below and run `uv tool install <file>.whl`.\n' "${TAG#v}" "$image")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "WhatdidIRun?? ${TAG}" --notes "$notes" --generate-notes --verify-tag
          fi
